[package]
name = "notepad-rs"
version = "0.1.0"
edition = "2021"
description = "A native Windows Notepad++-style text editor written in Rust"
license = "MIT"

[[bin]]
name = "notepad-rs"
path = "src/main.rs"

[dependencies]
ropey = { version = "1.6", default-features = false, features = ["simd"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_Globalization",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Time",
    "Win32_System_SystemServices",
    "Win32_UI_Shell_Common",
]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
